plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dio'
version = '0.0.1-SNAPSHOT'
description = 'budgeting'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation platform('org.springframework.ai:spring-ai-bom:2.0.2')

    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
    implementation 'com.qxotic:jinfer-spring-ai-spring-boot-starter:0.3.1'

    implementation 'com.qxotic:jinfer-parakeet:0.3.1'

    runtimeOnly 'com.qxotic:jam-native:0.3.1'
    runtimeOnly 'com.qxotic:jam-vector:0.3.1'
}

bootRun {
    jvmArgs(
            '--add-modules', 'jdk.incubator.vector',
            '--enable-native-access=ALL-UNNAMED'
    )
}

test {
    useJUnitPlatform()
    jvmArgs(
            '--add-modules', 'jdk.incubator.vector',
            '--enable-native-access=ALL-UNNAMED'
    )
}
